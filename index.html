<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Asistente educativo LogiMax</title>
<style>
:root{--navy:#15324b;--blue:#246b8e;--pale:#edf5f8;--ink:#1f2937;--muted:#64748b;--line:#dce5eb;--white:#fff}
*{box-sizing:border-box}body{margin:0;background:#f3f6f8;color:var(--ink);font:16px/1.5 system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif}.app{max-width:980px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column;background:#fff;box-shadow:0 8px 35px #10283a12}.top{background:var(--navy);color:#fff;padding:24px clamp(18px,4vw,36px)}.eyebrow{text-transform:uppercase;letter-spacing:.12em;font-size:.75rem;opacity:.8}.top h1{margin:4px 0;font-size:clamp(1.45rem,4vw,2rem)}.top p{margin:0;color:#dceaf1}.layout{display:grid;grid-template-columns:260px 1fr;flex:1;min-height:560px}.side{padding:20px 14px;background:#f7fafb;border-right:1px solid var(--line)}.side h2{font-size:.82rem;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);padding:0 10px}.nav{display:flex;flex-direction:column;gap:5px}.nav button,.quick button,.actions button{font:inherit;cursor:pointer;border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:#fff;color:var(--ink);text-align:left}.nav button:hover,.quick button:hover{border-color:var(--blue);background:var(--pale)}.nav button.active{background:#e3f0f5;border-color:#9fc4d4;color:var(--navy);font-weight:650}.main{padding:clamp(18px,4vw,34px);display:flex;flex-direction:column}.status{color:var(--muted);font-size:.82rem;margin-bottom:12px}.card{border:1px solid var(--line);border-radius:16px;padding:clamp(18px,3vw,26px);background:#fff;box-shadow:0 4px 16px #19374a08}.card h2{color:var(--navy);margin:0 0 14px;font-size:1.35rem}.content{white-space:pre-line}.resource-image{display:block;width:100%;max-width:760px;height:auto;margin:18px auto 8px;border:1px solid var(--line);border-radius:12px}.image-link{display:inline-block;margin:4px 0 14px;color:var(--blue);font-weight:600}.image-note{font-size:.88rem;color:var(--muted);margin-top:4px}.quick{display:flex;flex-wrap:wrap;gap:8px;margin-top:20px}.quick button{background:var(--pale);border-color:#d0e3eb;color:var(--navy);text-align:center}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:18px}.actions button{background:var(--navy);color:white;border-color:var(--navy);text-align:center}.actions .secondary{background:#fff;color:var(--navy);border-color:var(--line)}.foot{padding:12px 20px;color:var(--muted);font-size:.78rem;border-top:1px solid var(--line)}.quiz-options{display:grid;gap:8px;margin-top:16px}.quiz-options button{font:inherit;text-align:left;padding:12px;border:1px solid var(--line);border-radius:10px;background:#fff;cursor:pointer}.quiz-options button:hover{border-color:var(--blue);background:var(--pale)}.feedback{margin-top:12px;padding:12px;border-radius:10px;background:var(--pale)}.small{font-size:.88rem;color:var(--muted)}
@media(max-width:700px){.layout{grid-template-columns:1fr}.side{border-right:0;border-bottom:1px solid var(--line);padding:12px}.side h2{margin:4px 8px 8px}.nav{display:grid;grid-template-columns:repeat(2,minmax(0,1fr))}.nav button{font-size:.88rem;padding:9px}.main{min-height:420px}}
</style></head>
<body><div class="app"><header class="top"><div class="eyebrow">Asistente educativo</div><h1>LogiMax · Problemas de transporte</h1><p>Aprendé sobre métodos de solución, red logística y evaluación.</p></header><div class="layout"><aside class="side"><h2>Explorar temas</h2><nav class="nav" id="nav"></nav></aside><main class="main"><div class="status" id="status">Asistente listo · Elegí un tema para comenzar</div><section class="card" aria-live="polite"><h2 id="title">¡Hola! Bienvenido a LogiMax</h2><div class="content" id="content"></div><div id="quiz"></div><div class="quick" id="quick"></div><div class="actions"><button id="homeBtn" class="secondary">Volver al inicio</button><button id="evalBtn">Ir a la evaluación</button></div></section></main></div><footer class="foot">Proyecto educativo LogiMax · Chatbot interactivo sin necesidad de iniciar sesión.</footer></div>
<script>
const pages={
"Inicio":{title:"¡Hola! Soy el asistente educativo de LogiMax.",text:"Puedo ayudarte a aprender sobre los principales métodos utilizados en los problemas de transporte.\n\nElegí un tema en el menú o usá los accesos rápidos. También podés realizar la evaluación diagnóstica y los tres quizzes."},
"Caso LogiMax":{title:"Caso LogiMax",text:"LogiMax es una empresa que necesita transportar productos desde tres almacenes hacia cinco centros de distribución. El objetivo es satisfacer toda la demanda minimizando los costos de transporte y respetando las capacidades de cada ruta disponible.\n\nPodés consultar las explicaciones de los métodos o pasar directamente a la evaluación."},
"Esquina Noroeste":{title:"Método de Esquina Noroeste",text:"El método Esquina Noroeste es una técnica para obtener una solución inicial en problemas de transporte. El proceso comienza en la esquina superior izquierda de la tabla y realiza asignaciones considerando únicamente la oferta y la demanda.\n\nEste método no toma en cuenta los costos al decidir la primera asignación; sirve para construir una solución inicial."},
"Costo Mínimo":{title:"Método de Costo Mínimo",text:"El método de Costo Mínimo asigna primero la mayor cantidad posible a las rutas que presentan el menor costo de transporte. Generalmente produce mejores soluciones iniciales que el método Esquina Noroeste."},
"Vogel":{title:"Método de Vogel",text:"El método de Vogel utiliza penalizaciones para identificar las rutas más convenientes. Gracias a este enfoque suele generar una solución inicial más cercana a la solución óptima, pero no siempre."},
"Saltando Piedras":{title:"Método Saltando Piedras",text:"Saltando Piedras es un método de optimización que permite mejorar una solución inicial. Analiza rutas cerradas dentro de la red y determina si es posible reducir el costo total de transporte."},
"Red Logística":{title:"Red logística de LogiMax",text:"La red conecta los almacenes A, B y C con los destinos D, E, F, G y H mediante rutas con capacidades y costos definidos.\n\nUsá los temas del menú para conocer los métodos aplicados al caso.",imageUrl:"https://estudianteccr-my.sharepoint.com/:i:/g/personal/e_rivera_2_estudiantec_cr/IQCqXSz9b_c0TLQP3indcbDYAQ29w8i9ZXWG5kZ55D96HtA?e=beAaGO",imageLabel:"Abrir imagen de la red logística"},
"Solución final":{title:"Solución final",text:"La solución final permitió satisfacer toda la demanda utilizando las capacidades disponibles de la red logística. El costo total obtenido fue de $73.530.\n\nPodés continuar con la evaluación para repasar los conceptos.",imageUrl:"https://estudianteccr-my.sharepoint.com/:i:/g/personal/e_rivera_2_estudiantec_cr/IQC3wVrgi67eTYWltIu7VY93AUNh9QT64tMy0KJs57ly45Q?e=jSTbuP",imageLabel:"Abrir imagen de la solución final"},
"Evaluación":{title:"Evaluación diagnóstica",text:"Respondé las preguntas para repasar los conceptos principales. Después podés poner a prueba tus conocimientos con los tres quizzes.",quiz:"eval"},
"Quiz 1":{title:"Quiz 1 · Caso LogiMax",text:"¿Cuántos almacenes participan en el caso LogiMax?",quiz:"q1"},
"Quiz 2":{title:"Quiz 2 · Método de transporte",text:"¿Qué método utiliza penalizaciones?",quiz:"q2"},
"Quiz 3":{title:"Quiz 3 · Resultado final",text:"¿Cuál fue el costo final obtenido?",quiz:"q3"}
};
const quizzes={q1:{options:["A) 2","B) 3","C) 5"],correct:1,answer:"Respuesta correcta: B) 3 almacenes."},q2:{options:["A) Vogel","B) Esquina Noroeste","C) Saltando Piedras"],correct:0,answer:"Respuesta correcta: A) Vogel."},q3:{options:["A) $64.060","B) $73.530","C) $80.200"],correct:1,answer:"Respuesta correcta: B) $73.530."},eval:{questions:[{q:"1. ¿Crees que el método Vogel suele generar mejores soluciones iniciales?",options:["A) Sí","B) No"],correct:0},{q:"2. ¿Qué método se utiliza para optimizar una solución inicial?",options:["A) Saltando Piedras","B) Esquina Noroeste"],correct:0},{q:"3. ¿Qué busca minimizar un problema de transporte?",options:["A) Costos","B) Productos"],correct:0}]}};
const order=["Inicio","Caso LogiMax","Esquina Noroeste","Costo Mínimo","Vogel","Saltando Piedras","Red Logística","Solución final","Evaluación","Quiz 1","Quiz 2","Quiz 3"];
const nav=document.getElementById('nav'),title=document.getElementById('title'),content=document.getElementById('content'),quick=document.getElementById('quick'),quiz=document.getElementById('quiz'),status=document.getElementById('status');let current='Inicio',evalAnswers={};
function go(name){current=pages[name]?name:'Inicio';const p=pages[current];title.textContent=p.title;content.textContent=p.text;if(p.imageUrl){const img=document.createElement('img');img.className='resource-image';img.src=p.imageUrl;img.alt=p.imageLabel;img.loading='lazy';img.onerror=()=>{img.style.display='none';const note=document.createElement('p');note.className='image-note';note.textContent='La imagen no se pudo mostrar aquí (puede requerir permisos de SharePoint). Usá el enlace de abajo para abrirla.';content.appendChild(note)};content.appendChild(img);const a=document.createElement('a');a.className='image-link';a.href=p.imageUrl;a.target='_blank';a.rel='noopener noreferrer';a.textContent='↗ '+p.imageLabel;content.appendChild(a)}quiz.innerHTML='';quick.innerHTML='';status.textContent=current==='Inicio'?'Asistente listo · Elegí un tema para comenzar':'Tema seleccionado · '+current;[...nav.children].forEach(b=>b.classList.toggle('active',b.dataset.page===current));if(p.quiz==='eval')renderEval();else if(p.quiz)renderQuiz(p.quiz);const suggestions=current==='Inicio'?["Caso LogiMax","Esquina Noroeste","Costo Mínimo","Vogel","Saltando Piedras","Red Logística","Solución final","Evaluación"]:current.startsWith('Quiz')?["Quiz 1","Quiz 2","Quiz 3","Evaluación"]:["Esquina Noroeste","Costo Mínimo","Vogel","Saltando Piedras","Red Logística","Solución final","Evaluación"];suggestions.forEach(n=>{const b=document.createElement('button');b.textContent=n;b.onclick=()=>go(n);quick.appendChild(b)});}
order.forEach(n=>{const b=document.createElement('button');b.textContent=n;b.dataset.page=n;b.onclick=()=>go(n);nav.appendChild(b)});
function renderQuiz(id){const q=quizzes[id];const box=document.createElement('div');box.className='quiz-options';q.options.forEach((o,i)=>{const b=document.createElement('button');b.textContent=o;b.onclick=()=>{box.querySelectorAll('button').forEach(x=>x.disabled=true);const f=document.createElement('div');f.className='feedback';f.textContent=(i===q.correct?'¡Correcto! ':'No exactamente. ')+q.answer;box.appendChild(f)};box.appendChild(b)});quiz.appendChild(box)}
function renderEval(){quizzes.eval.questions.forEach((q,idx)=>{const h=document.createElement('p');h.innerHTML='<strong>'+q.q+'</strong>';quiz.appendChild(h);const box=document.createElement('div');box.className='quiz-options';q.options.forEach((o,i)=>{const b=document.createElement('button');b.textContent=o;b.onclick=()=>{evalAnswers[idx]=i;box.querySelectorAll('button').forEach((x,j)=>{x.disabled=true;if(j===q.correct)x.style.borderColor='#25845c'});const f=document.createElement('div');f.className='feedback';f.textContent=(i===q.correct?'¡Correcto! ':'Repasá este concepto. ')+(q.correct===0?'La respuesta correcta es '+q.options[q.correct]+'.':'La respuesta correcta es '+q.options[q.correct]+'.');box.appendChild(f)};box.appendChild(b)});quiz.appendChild(box)});const b=document.createElement('button');b.className='actions';b.textContent='Reiniciar evaluación';b.onclick=()=>{evalAnswers={};go('Evaluación')};quiz.appendChild(b)}
document.getElementById('homeBtn').onclick=()=>go('Inicio');document.getElementById('evalBtn').onclick=()=>go('Evaluación');go('Inicio');
</script></body></html>
